<div class="app">
<aside class="sidebar" aria-label="文档导航">
 <div class="brand"><span class="brand-mark">[ ]</span>Margin<span style="font-size:9px;letter-spacing:0;color:#84947e;margin-left:auto">LOCAL</span></div>
 <div class="brand-sub">A SPACE FOR DIALOGUE</div>
 <div class="workspace-label">WORKSPACE</div><div id="workspace-name" class="workspace-name"></div>
 <div class="nav-heading"><span>工作文档</span><span id="document-count"></span></div><nav id="document-list" aria-label="工作文档"></nav>
 <div class="sidebar-note"><strong><span class="local-dot"></span>在你的设备上</strong><p>正文已包含在此文件中。<br>批注后导出交接包，交给 agent。</p></div>
 <div class="sidebar-footer"><button class="quiet small" id="help-button">ⓘ 使用说明</button><button class="quiet small" id="recover-button" title="恢复浏览器中未导出的旧版本草稿" hidden>恢复草稿</button></div>
</aside>
<header class="topbar"><div class="breadcrumb">工作文档 <span style="padding:0 9px;color:#bdc6b7">/</span> <b id="breadcrumb"></b></div><div class="top-actions"><span class="save-state" id="save-state" role="status">已载入文档</span><button id="import-button" title="载入 agent 回复，或恢复完整交接包">↥ 载入回复</button><button class="primary" id="export-button">↗ 导出交接包</button></div></header>
<main class="content" id="content">
 <div id="storage-warning" class="notice" hidden></div>
 <header class="document-head"><div class="eyebrow"><span id="document-tag" class="tag"></span><span id="document-revision"></span><span>·</span><span id="document-wordcount"></span></div><div class="document-title-row"><h1 id="document-title"></h1><button class="quiet small" id="download-md" title="下载当前正文为 Markdown">↓ Markdown</button></div><p class="document-desc">阅读、留下想法，再把讨论交还给 agent。</p><div class="document-toolbar"><div class="tabs" aria-label="阅读或编辑"><button class="tab active" id="read-tab" aria-pressed="true">阅读文档</button><button class="tab" id="edit-tab" aria-pressed="false">编辑正文</button></div><div class="toolbar-actions"><button class="quiet small" id="add-comment">＋ 批注</button><button class="quiet small" id="add-memo">＋ 备忘</button></div></div></header>
 <div class="article-wrap"><article id="article" class="article"></article><section id="editor-section" hidden><label for="markdown-editor" class="editor-help">编辑 Markdown 正文</label><textarea id="markdown-editor" class="editor" spellcheck="false"></textarea><div class="editor-footer"><span class="editor-help">保存后增加文档版本。<br>原有批注与讨论会继续保留。</span><div class="editor-buttons"><button id="cancel-edit">取消</button><button class="primary" id="save-edit">保存修改</button></div></div></section><div class="footnote"><span id="source-label"></span><span>每一次修改，都有上下文。</span></div></div>
</main>

</div>

<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));
const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const labels={comment:'回复',rebuttal:'Rebuttal',decision:'结论'};
const embedded=JSON.parse($('workspace-data').textContent), storageKey='margin:v1:'+embedded.id, recoveryKey=storageKey+':recovery';

 validateWorkspace(data);modal('恢复完整交接包',`<p>将载入 <strong>${esc(data.title)}</strong>，其中包含 ${data.documents.length} 份文档和 ${data.threads.length} 条讨论。</p><div class="notice">这会替换当前页面的工作区。建议先导出当前内容，再恢复交接包。</div>`,'<button type="button" id="backup-current">导出当前内容</button><button type="button" data-close>取消</button><button type="submit" class="primary">恢复交接包</button>',()=>{if(data.id!==embedded.id){toast('此模板只恢复相同工作区的交接包，请用该工作区的 HTML 打开');return}state=clone(data);selectedDoc=state.documents[0].id;selectedThread=null;replyDrafts.clear();save();closeModal();render();toast('交接包已恢复')});$('backup-current').onclick=()=>exportState();
 }else{const p=feedbackPreview(data);modal('载入 agent 的回复',`<p>将合并到当前工作区：</p><ul><li>${p.newMessages} 条回复 · ${p.newThreads} 条新讨论</li><li>${p.changed} 份正文修改</li><li>${p.skipped} 项重复内容将跳过</li></ul>${p.conflicts?`<div class="notice">${p.conflicts} 项修改与当前版本冲突，将保留为待处理讨论，正文不会被覆盖。</div>`:''}`,'<button type="button" data-close>取消</button><button type="submit" class="primary">确认载入</button>',()=>{state=p.next;save();closeModal();render();toast('回复已载入'+(p.conflicts?'，请查看版本冲突讨论':''))})}
 }catch(error){toast('无法载入：'+error.message)}
};
$('recover-button').onclick=()=>{if(!recoveredDraft)return;modal('旧版本本地草稿','<p>这是重新生成 HTML 之前留在此浏览器中的草稿。你可以导出它交给 agent 合并，或将整个页面恢复为此草稿。</p><div class="notice">恢复会用旧草稿替换当前内容。请先导出需要保留的新版本。</div>','<button type="button" id="export-old">导出旧草稿</button><button type="button" data-close>取消</button><button type="submit" class="primary">恢复旧草稿</button>',()=>{state=clone(recoveredDraft);selectedDoc=state.documents[0].id;recoveredDraft=null;cacheWarning='';$('storage-warning').hidden=true;save();closeModal();render();toast('已恢复旧草稿')});$('export-old').onclick=()=>exportState(recoveredDraft)};
$('help-button').onclick=()=>modal('一份文档，一段持续的对话',`<div class="help-step"><b>1</b><p><strong>Agent 生成页面</strong><br>正文已经包含在 HTML 中，打开就能读。</p></div><div class="help-step"><b>2</b><p><strong>阅读与反馈</strong><br>选中同一段内的文字添加批注；也可添加整篇批注、备忘或编辑 Markdown 正文。</p></div><div class="help-step"><b>3</b><p><strong>导出交接包</strong><br>将 JSON 文件交给 agent。它包含正文、文档版本、引用与每条讨论。</p></div><div class="help-step"><b>4</b><p><strong>继续讨论</strong><br>Agent 可生成新版 HTML，或提供回复 JSON，通过右上角“载入回复”合并。</p></div><div class="notice">本地保存只属于当前浏览器。文件移动、浏览器清理或切换设备前，请导出交接包。备忘日期只在页面内显示到期状态。</div><p style="margin-top:18px">交给 agent 时可附上：</p><pre class="help-code">请阅读 JSON 交接包中的 documents 与 threads。\n逐条回应待处理讨论，保留文档、讨论和消息 ID。\n修订正文时增加 revision，并生成新版 HTML；\n或按 agent-docs-feedback v1 格式返回回复 JSON。</pre>`,'<button type="button" class="primary" data-close>开始协作</button>',null);
window.addEventListener('beforeunload',e=>{if(editingDirty||Array.from(replyDrafts.values()).some(d=>d.body.trim())){e.preventDefault();e.returnValue=''}});
try{render()}catch(error){$('article').textContent='无法读取此文档：'+error.message}
})();
</script>
</body>
</html>
